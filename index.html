<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* High-End Dark Palette with Vibrant Neon Accent */
            --bg-color: #060a0f;
            --bg-gradient: radial-gradient(circle at 80% 20%, #152538 0%, #060a0f 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --accent-color: #ff6b35;
            --neon-glow-primary: rgba(255, 107, 53, 0.6);
            --neon-glow-secondary: rgba(255, 183, 3, 0.4);
            --text-main: #f4f4f0;
            --text-muted: #a4b3c6;
            --nav-bg: rgba(6, 10, 15, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
            background-attachment: fixed;
        }

        /* Navigation Menu */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--neon-glow-primary);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Hero Layout */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            position: relative;
            padding-top: 100px;
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 100px;
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.15);
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--neon-glow-primary), 0 0 40px rgba(255, 107, 53, 0.2);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hero-cta-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .cta-btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: var(--accent-color);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 20px var(--neon-glow-primary);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px var(--neon-glow-primary), 0 0 15px rgba(255, 183, 3, 0.5);
        }

        /* Hero Social Links */
        .hero-social-links {
            display: flex;
            gap: 1.2rem;
        }

        .hero-social-links a {
            color: var(--text-muted);
            font-size: 1.4rem;
            transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
        }

        .hero-social-links a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
            text-shadow: 0 0 15px var(--neon-glow-primary);
        }

        /* Ultra-Neon Ambient Glow Studio Backing */
        .hero-visual {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 480px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Ambient Layered Pulsing Neon Spheres */
        .main-sphere {
            position: absolute;
            width: 390px;
            height: 390px;
            background: radial-gradient(circle, var(--neon-glow-primary) 0%, var(--neon-glow-secondary) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.85;
            animation: neonPulse 4s infinite alternate;
        }

        .secondary-sphere {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(123, 241, 168, 0.25) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.6;
            animation: neonPulseSecondary 6s infinite alternate;
        }

        /* Animated SVG Character */
        .character-art {
            position: absolute;
            width: 420px;
            height: auto;
            z-index: 2;
            bottom: 30px;
            transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            filter: drop-shadow(0 0 35px rgba(255, 107, 53, 0.3)) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
        }

        /* Floating Tech Tokens */
        .tech-icon {
            position: absolute;
            width: 64px;
            height: 64px;
            background: rgba(21, 37, 56, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            color: var(--text-main);
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.2), inset 0 0 10px rgba(255,255,255,0.05);
            z-index: 3;
            backdrop-filter: blur(12px);
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            will-change: transform, opacity;
        }

        .icon-1 { top: 2%; left: 8%; }
        .icon-2 { top: 12%; right: 4%; }
        .icon-3 { bottom: 35%; left: 4%; }
        .icon-4 { bottom: 40%; right: 6%; }

        /* Animated Scroll Down Indicator Label */
        .scroll-indicator {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            z-index: 10;
        }

        .scroll-indicator:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--neon-glow-primary);
        }

        .scroll-indicator i {
            font-size: 1rem;
            animation: bounce 1.8s infinite;
        }

        /* General Sections */
        section {
            padding: 8rem 8% 4rem 8%;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3.5rem;
            position: relative;
            display: inline-block;
        }

        .section-title span {
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--neon-glow-primary);
        }

        /* Projects Section (Glassmorphism Cards) */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px;
        }

        .project-card:hover {
            border-color: rgba(255, 107, 53, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(255, 107, 53, 0.15);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(255, 107, 53, 0.2), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-icon {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            z-index: 2;
            filter: drop-shadow(0 0 8px var(--neon-glow-primary));
        }

        .project-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
            font-weight: 600;
            z-index: 2;
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            z-index: 2;
        }

        .project-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .project-link i {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .project-link:hover {
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--neon-glow-primary);
        }

        .project-link:hover i {
            transform: translate(3px, -3px);
        }

        /* Skills Layout */
        .skills-container {
            max-width: 800px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            list-style: none;
        }

        .skills-list li {
            padding: 0.6rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 100px;
            font-size: 0.9rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .skills-list li:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.2);
            color: var(--text-main);
        }

        /* Footer Section */
        footer {
            padding: 4rem 8%;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: rgba(6, 10, 15, 0.8);
        }

        .footer-socials {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .footer-socials a {
            color: var(--text-muted);
            font-size: 1.4rem;
            transition: color 0.3s ease, transform 0.3s, text-shadow 0.3s;
            text-decoration: none;
        }

        .footer-socials a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-glow-primary);
        }

        /* Custom Animations */
        @keyframes neonPulse {
            0% { transform: scale(1); opacity: 0.75; }
            100% { transform: scale(1.1); opacity: 0.95; }
        }

        @keyframes neonPulseSecondary {
            0% { transform: scale(1.05); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .hero {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding-top: 140px;
                padding-bottom: 6rem;
            }
            .hero-content {
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .hero-cta-group {
                justify-content: center;
            }
            .hero h1 {
                font-size: 3rem;
            }
            .hero-visual {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                margin-top: 4rem;
                width: 100%;
                height: 400px;
            }
            .scroll-indicator {
                display: none;
            }
        }

        @media (max-width: 576px) {
            .nav-links {
                display: none;
            }
            .hero h1 {
                font-size: 2.4rem;
            }
            footer {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }
        }
    </style>
</head>
