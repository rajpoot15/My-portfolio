<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarun | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --accent-color: #ff6b35;
            --text-main: #f4f4f0;
            --text-muted: #a4b3c6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }
        
        /* Section styling */
        section { width: 100vw; min-height: 100vh; display: flex; align-items: center; padding: 0 10%; border-bottom: 1px solid var(--card-border); }
        
        /* Hero Section */
        #home { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; padding-top: 100px; }
        .hero-content h1 { font-size: 3.5rem; }
        .hero-content h1 span { color: var(--accent-color); }
        
        /* Skills and Projects */
        .skills-list { display: flex; flex-wrap: wrap; gap: 1rem; list-style: none; }
        .skills-list li { padding: 0.8rem 1.5rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50px; }
        .projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
        .project-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 2rem; border-radius: 20px; }
    </style>
</head>
<body>

    <section id="home">
        <div class="hero-content">
            <h1>Hey, I am Tarun.<br>A <span>Web Developer</span></h1>
            <p>I build interactive frontend experiences.</p>
        </div>
    </section>

    <section id="skills">
        <div>
            <h2>My Skills</h2>
            <ul class="skills-list">
                <li>HTML5 / CSS3</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>UI Design</li>
            </ul>
        </div>
    </section>

    <section id="projects">
        <div class="projects-grid">
            <div class="project-card">
                <h3>Interactive Calculator</h3>
                <a href="https://rajpoot15.github.io/Calculator/" target="_blank">View Project</a>
            </div>
            <div class="project-card">
                <h3>Weather App</h3>
                <a href="https://rajpoot15.github.io/Wheather---App/" target="_blank">View Project</a>
            </div>
        </div>
    </section>

    <section id="contact">
        <div>
            <h2>Contact Me</h2>
            <p><i class="fas fa-envelope"></i> tarunsingh736781@gmail.com</p>
            <p><a href="https://www.linkedin.com/in/tarun-kumar-singh-4721b937a" target="_blank">LinkedIn Profile</a></p>
        </div>
    </section>

</body>
</html>
