<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarun's AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000000; color: #ffffff; font-family: "Space Mono", monospace; }
    .glass-card {
      background: rgba(12, 12, 12, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    #chatMessages::-webkit-scrollbar { width: 4px; }
    #chatMessages::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.3); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-black">

  <!-- TOP HEADER -->
  <header class="max-w-2xl mx-auto w-full flex justify-between items-center glass-card p-4 rounded-2xl mb-4 border border-cyan-500/30 shadow-lg">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400">
        <i class="bi bi-robot text-sm"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold tracking-wider text-cyan-300 flex items-center gap-1.5">
          TARUN'S AI ASSISTANT
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </h1>
        <p class="text-[10px] text-cyan-300/80">Online • Powered by Gemini AI</p>
      </div>
    </div>
    <a href="index.html" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl border border-white/20 transition flex items-center gap-1.5 text-white">
      <i class="bi bi-arrow-left"></i>
      <span>Back to Portfolio</span>
    </a>
  </header>

  <!-- CHAT CONTAINER -->
  <main class="max-w-2xl mx-auto w-full flex-grow glass-card rounded-2xl flex flex-col shadow-2xl overflow-hidden border border-cyan-500/30 h-[70vh]">
    
    <!-- Messages Box -->
    <div id="chatMessages" class="flex-grow p-4 overflow-y-auto space-y-4 text-xs sm:text-sm">
      <div class="flex gap-2.5">
        <div class="w-6 h-6 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400 shrink-0 text-[10px]">
          <i class="bi bi-robot"></i>
        </div>
        <div class="bg-gradient-to-br from-neutral-900 to-cyan-950/30 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tl-sm text-white/90 max-w-[85%] leading-relaxed shadow-lg">
          👋 Hi there! Kuch bhi zaroorat pade, mujhe yaad karna! Ask me anything about Tarun's skills, projects, BCA studies at LPU, or development experience.
        </div>
      </div>
    </div>

    <!-- Input Bar -->
    <div class="p-3 bg-black/90 border-t border-white/10 flex gap-2 items-center">
      <input type="text" id="chatInput" placeholder="Ask anything about Tarun..." 
             onkeypress="if(event.key==='Enter') sendChatMessage()"
             class="bg-white/5 border border-white/15 text-xs sm:text-sm rounded-xl px-4 py-3 flex-grow focus:outline-none focus:border-cyan-400 text-white placeholder-white/40">
      <button onclick="sendChatMessage()" class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-black font-bold px-5 py-3 rounded-xl text-xs sm:text-sm transition flex items-center justify-center shadow-lg shadow-cyan-500/20">
        <i class="bi bi-send-fill text-black"></i>
      </button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-[10px] text-white/40 mt-4">
    Powered by Google Gemini API • Built by Tarun Singh
  </footer>

  <script>
    // STANDARD GOOGLE AI STUDIO API KEY FORMAT
    const API_KEY = "AQ.Ab8RN6KrE1vJVh0qaX2OML17B2127l6Ps-Nd8V8CfN3UuJFtQg";
    const MODEL_NAME = "gemini-1.5-flash";

    async function callGemini(promptText) {
      const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });
        const data = await response.json();
        if (!response.ok) {
          return `❌ Error: ${data.error?.message || "API request failed."}`;
        }
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate a response.";
      } catch (err) {
        return `❌ Connection Error. Please check your network.`;
      }
    }

    async function sendChatMessage() {
      const inputField = document.getElementById('chatInput');
      const messageBox = document.getElementById('chatMessages');
      const userText = inputField.value.trim();
      if (!userText) return;

      messageBox.innerHTML += `
        <div class="flex gap-2.5 justify-end">
          <div class="bg-cyan-500/20 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tr-sm text-white max-w-[85%] text-right shadow-lg">
            ${userText}
          </div>
        </div>`;
      inputField.value = '';
      messageBox.scrollTop = messageBox.scrollHeight;

      const systemContext = `You are an AI assistant for Tarun Singh's developer portfolio. Tarun is a BCA student at LPU (graduating 2027), works as a Customer Support Executive at Dr ITM Limited, and builds front-end web apps, Python automation tools, and AI bots. Be professional, friendly, and concise. User question: `;

      const loadingId = 'loading-' + Date.now();
      messageBox.innerHTML += `
        <div id="${loadingId}" class="flex gap-2.5">
          <div class="w-6 h-6 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400 shrink-0 text-[10px]"><i class="bi bi-robot"></i></div>
          <div class="bg-white/10 border border-white/5 p-3 rounded-2xl text-white/70 max-w-[85%]">Thinking...</div>
        </div>`;
      messageBox.scrollTop = messageBox.scrollHeight;

      const response = await callGemini(systemContext + userText);

      const loadingElem = document.getElementById(loadingId);
      if (loadingElem) loadingElem.remove();

      const isError = response.includes('❌');
      const msgStyle = isError ? 'bg-rose-950/60 border-rose-500/50 text-rose-300' : 'bg-gradient-to-br from-neutral-900 to-neutral-800 border-white/10 text-white/90';

      messageBox.innerHTML += `
        <div class="flex gap-2.5">
          <div class="w-6 h-6 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400 shrink-0 text-[10px]"><i class="bi bi-robot"></i></div>
          <div class="${msgStyle} border p-3.5 rounded-2xl rounded-tl-sm max-w-[85%] leading-relaxed shadow-lg">
            ${response}
          </div>
        </div>`;
      messageBox.scrollTop = messageBox.scrollHeight;
    }
  </script>
</body>
</html>
