<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask AI — Tarun Singh Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Space Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    *, ::before, ::after { box-sizing: border-box; }
    html, body {
      background-color: #050505;
      color: #ffffff;
      font-family: "Space Mono", monospace;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .glass-card {
      background: rgba(12, 12, 16, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    .btn-mate {
      background: #121212;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .btn-mate:hover {
      background: #ffffff;
      color: #000000;
    }
    .chat-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.3);
      border-radius: 4px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .neon-border {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.12);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="w-full h-14 shrink-0 flex items-center justify-between px-4 bg-black/95 border-b border-white/10 z-50">
    <a href="index.html" class="btn-mate px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
      <i class="bi bi-arrow-left"></i>
      <span>Home</span>
    </a>
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      <span class="text-[11px] font-bold tracking-wider text-cyan-400">TARUN AI ASSISTANT</span>
    </div>
  </nav>

  <!-- MAIN CHAT CONTAINER -->
  <main class="flex-grow w-full max-w-4xl mx-auto p-3 flex flex-col justify-between" style="height: calc(100dvh - 56px);">
    
    <div class="glass-card w-full h-full rounded-2xl p-3 sm:p-4 flex flex-col justify-between overflow-hidden neon-border">
      
      <!-- CHAT MESSAGES BOX -->
      <div id="chatMessages" class="chat-scroll flex-grow overflow-y-auto space-y-3 pr-1 mb-3">
        
        <!-- BOT WELCOME MSG -->
        <div class="flex gap-2.5 items-start">
          <div class="w-7 h-7 rounded-xl bg-cyan-950 border border-cyan-400/40 flex items-center justify-center shrink-0">
            <i class="bi bi-robot text-cyan-400 text-xs"></i>
          </div>
          <div class="bg-neutral-900 border border-white/10 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-xs leading-relaxed text-neutral-200">
            👋 Hi! I'm Tarun Singh's Portfolio AI. Ask me about Tarun's skills, BCA degree, Dr ITM Limited role, or featured web projects!
          </div>
        </div>

      </div>

      <!-- QUICK SUGGESTION PROMPT CHIPS -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 mb-3 no-scrollbar shrink-0">
        <button onclick="sendQuickPrompt('Who is Tarun Singh?')" class="px-2.5 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-[10px] text-cyan-300 hover:bg-cyan-900/80 whitespace-nowrap transition-all">
          👤 Who is Tarun?
        </button>
        <button onclick="sendQuickPrompt('What are his technical skills?')" class="px-2.5 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-[10px] text-emerald-300 hover:bg-emerald-900/80 whitespace-nowrap transition-all">
          💻 Technical Skills
        </button>
        <button onclick="sendQuickPrompt('Tell me about his work experience')" class="px-2.5 py-1 rounded-full bg-amber-950/60 border border-amber-500/30 text-[10px] text-amber-300 hover:bg-amber-900/80 whitespace-nowrap transition-all">
          💼 Work Experience
        </button>
        <button onclick="sendQuickPrompt('What projects has he built?')" class="px-2.5 py-1 rounded-full bg-purple-950/60 border border-purple-500/30 text-[10px] text-purple-300 hover:bg-purple-900/80 whitespace-nowrap transition-all">
          🚀 Featured Projects
        </button>
      </div>

      <!-- INPUT FORM -->
      <div class="flex items-center gap-2 bg-black/90 p-2 rounded-xl border border-white/20 shrink-0">
        <input type="text" id="userInput" placeholder="Ask anything about Tarun..." 
               class="bg-transparent text-xs text-white placeholder-neutral-500 focus:outline-none w-full px-2 py-1"
               onkeyup="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-cyan-500 text-black px-3.5 py-2 rounded-lg text-xs font-bold hover:bg-cyan-400 active:scale-95 transition-all flex items-center gap-1 shrink-0">
          <span>Send</span>
          <i class="bi bi-send-fill"></i>
        </button>
      </div>

    </div>

  </main>

  <script>
    function sendQuickPrompt(promptText) {
      document.getElementById('userInput').value = promptText;
      sendMessage();
    }

    function sendMessage() {
      const inputField = document.getElementById('userInput');
      const messagesContainer = document.getElementById('chatMessages');
      const text = inputField.value.trim();

      if (!text) return;

      // 1. Append User Message
      const userMsgHTML = `
        <div class="flex gap-2.5 items-start justify-end">
          <div class="bg-cyan-950/80 border border-cyan-400/30 p-3 rounded-2xl rounded-tr-none max-w-[85%] text-xs leading-relaxed text-cyan-100">
            ${escapeHtml(text)}
          </div>
          <div class="w-7 h-7 rounded-xl bg-neutral-800 border border-white/10 flex items-center justify-center shrink-0">
            <i class="bi bi-person-fill text-white/80 text-xs"></i>
          </div>
        </div>
      `;
      messagesContainer.innerHTML += userMsgHTML;
      inputField.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // 2. Add Typing Indicator
      const typingId = 'typing-' + Date.now();
      const typingHTML = `
        <div id="${typingId}" class="flex gap-2.5 items-start">
          <div class="w-7 h-7 rounded-xl bg-cyan-950 border border-cyan-400/40 flex items-center justify-center shrink-0">
            <i class="bi bi-robot text-cyan-400 text-xs"></i>
          </div>
          <div class="bg-neutral-900 border border-white/10 p-3 rounded-2xl rounded-tl-none text-xs text-cyan-400 animate-pulse">
            AI is thinking...
          </div>
        </div>
      `;
      messagesContainer.innerHTML += typingHTML;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // 3. Process Bot Response
      setTimeout(() => {
        document.getElementById(typingId).remove();
        const responseText = generateAIResponse(text);

        const botMsgHTML = `
          <div class="flex gap-2.5 items-start">
            <div class="w-7 h-7 rounded-xl bg-cyan-950 border border-cyan-400/40 flex items-center justify-center shrink-0">
              <i class="bi bi-robot text-cyan-400 text-xs"></i>
            </div>
            <div class="bg-neutral-900 border border-white/10 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-xs leading-relaxed text-neutral-200">
              ${responseText}
            </div>
          </div>
        `;
        messagesContainer.innerHTML += botMsgHTML;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 500);
    }

    function generateAIResponse(query) {
      const q = query.toLowerCase();

      // STRICT SCOPE CHECK: Match Portfolio Keywords
      const isPortfolioRelated = 
        q.includes('who') || q.includes('tarun') || q.includes('about') || q.includes('bio') ||
        q.includes('skill') || q.includes('tech') || q.includes('language') || q.includes('stack') ||
        q.includes('experience') || q.includes('job') || q.includes('work') || q.includes('itm') ||
        q.includes('project') || q.includes('bot') || q.includes('app') || q.includes('dashboard') ||
        q.includes('contact') || q.includes('email') || q.includes('reach') || q.includes('lpu') || q.includes('bca');

      if (!isPortfolioRelated) {
        return "⚠️ <strong>Sorry, I can't provide this information.</strong> I am an assistant built specifically for Tarun Singh's portfolio. I can only answer questions about Tarun's education, technical skills, work experience, and featured projects.";
      }

      // TARUN PORTFOLIO KNOWLEDGE BASE
      if (q.includes('who') || q.includes('tarun') || q.includes('about') || q.includes('bio') || q.includes('lpu') || q.includes('bca')) {
        return "Tarun Singh is a Web Developer pursuing a BCA online at Lovely Professional University (expected graduation 2027). He works as a Customer Support Executive (Email Process) at Dr ITM Limited since March 2024.";
      }
      
      if (q.includes('skill') || q.includes('tech') || q.includes('language') || q.includes('stack')) {
        return "Tarun's core technical skills include HTML5, CSS3, JavaScript, Tailwind CSS, Python, Git, and Gemini API integrations.";
      }

      if (q.includes('experience') || q.includes('job') || q.includes('work') || q.includes('itm')) {
        return "Tarun has been working at Dr ITM Limited as a Customer Support Executive (Email Process) since March 13, 2024, balancing professional workplace support with software development.";
      }

      if (q.includes('project') || q.includes('bot') || q.includes('app') || q.includes('dashboard')) {
        return "Tarun's featured projects include the Music Player Streaming App, Live Weather Forecast App, Modern Calculator, Performance Tracker Dashboard, Telegram Q Solver AI Bot (@HelperinfoBuddy_bot), and the Live AI Bug Fixer!";
      }

      if (q.includes('contact') || q.includes('email') || q.includes('reach')) {
        return "You can reach out to Tarun through the Contact page link in the main navigation header!";
      }

      return "Tarun Singh is a passionate web developer and BCA student at LPU. Feel free to ask about his skills, work experience at Dr ITM Limited, or projects!";
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
