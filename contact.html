<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Tarun Singh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #000000; color: #ffffff; font-family: 'Space Mono', monospace; }
    .glass-card { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); }
    .btn-mate { background: #121212; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
    .btn-mate:hover { background: #ffffff; color: #000000; border-color: #ffffff; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-black">

  <div class="max-w-xl w-full glass-card p-8 sm:p-12 rounded-3xl flex flex-col gap-6 shadow-2xl relative">
    <div class="text-center">
      <span class="text-white/60 text-[11px] tracking-[0.3em] uppercase px-6 py-2 border border-white/20 rounded-full bg-white/5 inline-block mb-4">
        GET IN TOUCH
      </span>
      <h1 class="text-3xl sm:text-4xl font-light tracking-wide text-white">Send Me a Message</h1>
      <p class="text-xs sm:text-sm text-white/60 mt-2">Fill out your details below and I'll get back to you as soon as possible.</p>
    </div>

    <form action="https://formspree.io/f/xjybgrrk" method="POST" class="flex flex-col gap-4 w-full">
      <div class="flex flex-col gap-1.5">
        <label for="name" class="text-xs text-white/80 tracking-wider uppercase">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe" class="w-full bg-neutral-900 border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white transition-all">
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs text-white/80 tracking-wider uppercase">Your Email</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com" class="w-full bg-neutral-900 border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white transition-all">
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="message" class="text-xs text-white/80 tracking-wider uppercase">Your Message</label>
        <textarea id="message" name="message" rows="4" required placeholder="Write your message here..." class="w-full bg-neutral-900 border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white transition-all resize-none"></textarea>
      </div>

      <button type="submit" class="btn-mate w-full py-3.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 mt-2">
        <span>Send Message</span>
        <i class="bi bi-send-fill text-amber-400"></i>
      </button>
    </form>

    <div class="text-center pt-4 border-t border-white/10 flex flex-col gap-2">
      <a href="index.html" class="text-xs text-white/60 hover:text-white transition-colors inline-flex items-center justify-center gap-1.5">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Main Portfolio</span>
      </a>
      <p class="text-xs text-emerald-400/90 font-mono tracking-wide mt-2">Made by Rajpøøt</p>
    </div>
  </div>

</body>
</html>
